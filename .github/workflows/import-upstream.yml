name: Import EVEE Tune Android source
# Stable baseline: preserve the known-good 8211636 app behavior; no refresh-rate override.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-upstream.yml"

permissions:
  contents: write

concurrency:
  group: evee-tune-source-import
  cancel-in-progress: false

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EVEE Tune
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-37.0" "cmake;3.22.1" "ndk;27.2.12479018"
          # Android SDK publishes API 37 under android-37.0; AGP 9.1 expects android-37.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Download upstream source
        run: |
          git init /tmp/lastwave-upstream
          git -C /tmp/lastwave-upstream remote add origin https://github.com/Clash-Projects/LastWave-Native.git
          git -C /tmp/lastwave-upstream fetch --depth 1 origin 6c7e9d8c3c14a6798de7251e21d723a62044508f
          git -C /tmp/lastwave-upstream checkout --detach FETCH_HEAD

      - name: Import source and apply EVEE Tune identity
        shell: bash
        run: |
          set -euo pipefail
          # Remove the previous imported source before overlaying the new upstream tree.
          # This prevents deleted/renamed upstream Kotlin files from surviving as stale duplicates.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'README.md' ! -name 'evee_icon.png' ! -name 'app_icon_*.png' -exec rm -rf {} +
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='README.md' /tmp/lastwave-upstream/ ./
          # Preserve the user-uploaded EVEE Tune artwork and install it as the adaptive launcher icon.
          if [ ! -s evee_icon.png ]; then
            echo 'evee_icon.png is missing from the repository root.' >&2
            exit 1
          fi
          mkdir -p app/src/main/res/drawable-nodpi
          cp evee_icon.png app/src/main/res/drawable-nodpi/evee_icon.png
          # Preserve and install the four user-supplied EVEE Tune appearance icons.
          for icon in app_icon_default_.png app_icon_black_and_white.png app_icon_monochrome.png app_icon_pink_.png; do
            if [ ! -s "$icon" ]; then
              echo "Required appearance icon $icon is missing from the repository root." >&2
              exit 1
            fi
          done
          cp app_icon_default_.png app/src/main/res/drawable-nodpi/evee_icon_default.png
          cp app_icon_black_and_white.png app/src/main/res/drawable-nodpi/evee_icon_desktop.png
          cp app_icon_monochrome.png app/src/main/res/drawable-nodpi/evee_icon_white.png
          cp app_icon_pink_.png app/src/main/res/drawable-nodpi/evee_icon_black.png

          python3 <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("app/build.gradle.kts")
          gradle = gradle_file.read_text(encoding="utf-8")
          old = 'applicationId = if (vivoOrigin) "com.tencent.qqmusic" else "com.lastwave.app"'
          new = 'applicationId = if (vivoOrigin) "com.tencent.qqmusic" else "com.evee.tune"'
          if old not in gradle:
              raise SystemExit("Could not find the expected upstream applicationId line; stopping without committing.")
          gradle_file.write_text(gradle.replace(old, new, 1), encoding="utf-8")

          settings_file = Path("settings.gradle.kts")
          if settings_file.exists():
              settings = settings_file.read_text(encoding="utf-8")
              settings_file.write_text(settings.replace('rootProject.name = "LastWave"', 'rootProject.name = "EVEE Tune"'), encoding="utf-8")

          strings_file = Path("app/src/main/res/values/strings.xml")
          strings = strings_file.read_text(encoding="utf-8")
          strings, count = re.subn(
              r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
              r'\1EVEE Tune\2',
              strings,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("Could not update the launcher app label; stopping without committing.")
          strings_file.write_text(strings, encoding="utf-8")

          # Point Android 8+ adaptive launcher icons at the supplied EVEE Tune artwork.
          for icon_xml in (Path("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"), Path("app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml")):
              if icon_xml.exists():
                  icon_text = icon_xml.read_text(encoding="utf-8")
                  icon_text = re.sub(r'android:drawable="@drawable/ic_launcher_foreground"', 'android:drawable="@drawable/evee_icon"', icon_text)
                  icon_text = re.sub(r'\\s*<monochrome\\s+android:drawable="@drawable/evee_icon"\\s*/>', '', icon_text)
                  icon_xml.write_text(icon_text, encoding="utf-8")

          # Rebrand user-visible strings across default and translated resources.
          for resource_file in Path("app/src/main/res").glob("values*/strings.xml"):
              resource_text = resource_file.read_text(encoding="utf-8")
              resource_text = resource_text.replace("Made by LastWave Team", "Made by EVO")
              resource_text = resource_text.replace("LastWave Team", "EVO")
              resource_text = resource_text.replace("LastWave", "EVEE Tune")
              resource_file.write_text(resource_text, encoding="utf-8")

          # Keep the About screen's developer credit explicit in the default locale.
          strings = strings_file.read_text(encoding="utf-8")
          strings, about_count = re.subn(
              r'(<string\s+name="about_made_by"[^>]*>).*?(</string>)',
              r'\1Made by EVO\2',
              strings,
              count=1,
              flags=re.DOTALL,
          )
          if about_count != 1:
              raise SystemExit("Could not set the EVEE Tune developer credit; stopping without committing.")
          strings_file.write_text(strings, encoding="utf-8")

          # Replace the upstream About & Community links with EVEE Tune's contact details.
          settings_screen = Path("app/src/main/java/com/lastwave/app/ui/settings/SettingsScreen.kt")
          if settings_screen.exists():
              screen = settings_screen.read_text(encoding="utf-8")
              about_section = screen.find('SectionLabel(stringResource(R.string.settings_section_about))')
              group_start = screen.find('SettingsGroup(rowCount = 4)', about_section)
              group_end = screen.find('                    Spacer(Modifier.height(4.dp))', group_start)
              if about_section < 0 or group_start < 0 or group_end < 0:
                  raise SystemExit("Could not locate the About & Community cards; stopping without committing.")
              replacement = '''SettingsGroup(rowCount = 2) { index, position ->
                          when (index) {
                              0 -> SettingsActionCard(
                                  icon = Icons.Filled.Code,
                                  iconContainer = MaterialTheme.colorScheme.primaryContainer,
                                  iconTint = MaterialTheme.colorScheme.onPrimaryContainer,
                                  title = "Developed By EVO",
                                  subtitle = "Instagram: https://www.instagram.com/e.v_.o?mdxt=MTZvZGg2a2R6cmx5dA==",
                                  onClick = {
                                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse("https://www.instagram.com/e.v_.o?mdxt=MTZvZGg2a2R6cmx5dA=="))
                                      if (!startActivitySafely(context, intent)) {
                                          viewModel.showToast(context.getString(R.string.toast_no_browser))
                                      }
                                  },
                                  position = position,
                                  isHighlighted = (highlightedSettingId == "about.developer"),
                              )
                              1 -> SettingsActionCard(
                                  icon = Icons.AutoMirrored.Filled.Send,
                                  iconContainer = MaterialTheme.colorScheme.secondaryContainer,
                                  iconTint = MaterialTheme.colorScheme.onSecondaryContainer,
                                  title = "Connect directly for reporting bugs and any other issues",
                                  subtitle = "jinomattathil@gmail.com",
                                  onClick = {
                                      val intent = Intent(Intent.ACTION_SENDTO, Uri.parse("mailto:jinomattathil@gmail.com"))
                                      if (!startActivitySafely(context, intent)) {
                                          viewModel.showToast(context.getString(R.string.toast_no_browser))
                                      }
                                  },
                                  position = position,
                                  isHighlighted = (highlightedSettingId == "about.contact"),
                              )
                          }
                      }
              '''
              screen = screen[:group_start] + replacement + screen[group_end:]
              screen = screen.replace('contentDescription = "LastWave"', 'contentDescription = "EVEE Tune"')
              screen = screen.replace('Text("LastWave", style = MaterialTheme.typography.headlineSmall', 'Text("EVEE Tune", style = MaterialTheme.typography.headlineSmall')
              settings_screen.write_text(screen, encoding="utf-8")
          # Patch the first-launch Join Support dialog (separate from the About menu).
          main_shell = Path("app/src/main/java/com/lastwave/app/ui/shell/MainShell.kt")
          if not main_shell.exists():
              raise SystemExit("Could not find MainShell.kt for the Join Support dialog patch.")
          shell = main_shell.read_text(encoding="utf-8")
          dialog_pattern = r'@Composable\nprivate fun JoinSupportDialog\(\n    onDismiss: \(\) -> Unit,\n\) \{.*?\n\}\n\nprivate fun openMaterialYouChannel'
          dialog_replacement = '''@Composable
          private fun JoinSupportDialog(
              onDismiss: () -> Unit,
          ) {
              val context = LocalContext.current
              AlertDialog(
                  onDismissRequest = onDismiss,
                  shape = RoundedCornerShape(24.dp),
                  containerColor = MaterialTheme.colorScheme.surfaceContainerHigh,
                  title = {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween,
                      ) {
                          Column {
                              Text(
                                  text = "Developed By EVO/Jino",
                                  style = MaterialTheme.typography.titleMedium,
                                  fontWeight = FontWeight.Bold,
                              )
                              Text(
                                  text = "EVEE Tune developer and support",
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.primary,
                                  fontWeight = FontWeight.SemiBold,
                              )
                          }
                          IconButton(onClick = onDismiss, modifier = Modifier.size(28.dp)) {
                              Icon(
                                  imageVector = Icons.Filled.Close,
                                  contentDescription = "Close",
                                  tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                  modifier = Modifier.size(18.dp),
                              )
                          }
                      }
                  },
                  text = {
                      Column(
                          modifier = Modifier.fillMaxWidth(),
                          verticalArrangement = Arrangement.spacedBy(10.dp),
                      ) {
                          Text(
                              text = "Connect directly for reporting bugs and any other issues.",
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                          Surface(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(14.dp))
                                  .clickable {
                                      runCatching {
                                          context.startActivity(
                                              android.content.Intent(
                                                  android.content.Intent.ACTION_VIEW,
                                                  android.net.Uri.parse("https://www.instagram.com/e.v_.o?mdxt=MTZvZGg2a2R6cmx5dA=="),
                                              ),
                                          )
                                      }.onFailure {
                                          android.widget.Toast.makeText(context, "No browser available to open Instagram", android.widget.Toast.LENGTH_SHORT).show()
                                      }
                                      onDismiss()
                                  },
                              color = MaterialTheme.colorScheme.surfaceContainerHighest.copy(alpha = 0.70f),
                              shape = RoundedCornerShape(14.dp),
                          ) {
                              Column(Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 12.dp)) {
                                  Text("Instagram", style = MaterialTheme.typography.labelLarge, fontWeight = FontWeight.SemiBold)
                                  Text(
                                      "https://www.instagram.com/e.v_.o?mdxt=MTZvZGg2a2R6cmx5dA==",
                                      style = MaterialTheme.typography.bodySmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                          }
                          Surface(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(14.dp))
                                  .clickable {
                                      runCatching {
                                          context.startActivity(
                                              android.content.Intent(
                                                  android.content.Intent.ACTION_SENDTO,
                                                  android.net.Uri.parse("mailto:jinomattathil@gmail.com"),
                                              ),
                                          )
                                      }.onFailure {
                                          android.widget.Toast.makeText(context, "No email app available", android.widget.Toast.LENGTH_SHORT).show()
                                      }
                                      onDismiss()
                                  },
                              color = MaterialTheme.colorScheme.surfaceContainerHighest.copy(alpha = 0.70f),
                              shape = RoundedCornerShape(14.dp),
                          ) {
                              Column(Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 12.dp)) {
                                  Text(
                                      "Connect directly for reporting bugs and any other issues",
                                      style = MaterialTheme.typography.labelLarge,
                                      fontWeight = FontWeight.SemiBold,
                                  )
                                  Text(
                                      "jinomattathil@gmail.com",
                                      style = MaterialTheme.typography.bodySmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                          }
                      }
                  },
                  confirmButton = {
                      FilledTonalButton(onClick = onDismiss, shape = RoundedCornerShape(14.dp)) {
                          Text("Close", style = MaterialTheme.typography.labelMedium, fontWeight = FontWeight.SemiBold)
                      }
                  },
              )
          }
          
          private fun openMaterialYouChannel'''
          shell, dialog_count = re.subn(dialog_pattern, lambda _: dialog_replacement, shell, count=1, flags=re.DOTALL)
          if dialog_count != 1:
              raise SystemExit("Could not replace the first-launch Join Support dialog; stopping without committing.")
          main_shell.write_text(shell, encoding="utf-8")

          # Brand the About card in the v5.2 split SettingsAboutSection file.
          about_file = Path("app/src/main/java/com/lastwave/app/ui/settings/SettingsAboutSection.kt")
          if not about_file.exists():
              raise SystemExit("Could not find SettingsAboutSection.kt.")
          about_source = about_file.read_text(encoding="utf-8")
          about_source, logo_count = re.subn(
              r'painter = painterResource\(appIcon\.logoRes\),\s*contentDescription = "LastWave"',
              'painter = painterResource(R.drawable.evee_icon),\n                    contentDescription = "EVEE Tune"',
              about_source,
              count=1,
          )
          about_source, title_count = re.subn(
              r'Text\("LastWave", style = MaterialTheme\.typography\.headlineSmall',
              'Text("EVEE Tune", style = MaterialTheme.typography.headlineSmall',
              about_source,
              count=1,
          )
          if logo_count != 1 or title_count != 1:
              raise SystemExit("Could not apply EVEE Tune About-card logo/title branding.")
          about_file.write_text(about_source, encoding="utf-8")

          # Connect the four appearance choices to the supplied EVEE Tune artwork.
          app_icon_file = Path("app/src/main/java/com/lastwave/app/data/local/AppIcon.kt")
          if not app_icon_file.exists():
              raise SystemExit("Could not locate AppIcon.kt; stopping without committing.")
          app_icon_source = app_icon_file.read_text(encoding="utf-8")
          icon_replacements = {
              "R.drawable.ic_launcher_logo,": "R.drawable.evee_icon_default,",
              "R.drawable.ic_launcher_logo_desktop,": "R.drawable.evee_icon_desktop,",
              "R.drawable.ic_launcher_logo_white,": "R.drawable.evee_icon_white,",
              "R.drawable.ic_launcher_logo_black,": "R.drawable.evee_icon_black,",
          }
          for old_icon, new_icon in icon_replacements.items():
              if app_icon_source.count(old_icon) != 1:
                  raise SystemExit(f"Could not uniquely locate {old_icon} in AppIcon.kt.")
              app_icon_source = app_icon_source.replace(old_icon, new_icon, 1)
          app_icon_file.write_text(app_icon_source, encoding="utf-8")

          # Ensure each launcher alias uses the matching supplied icon as well.
          manifest_file = Path("app/src/main/AndroidManifest.xml")
          manifest = manifest_file.read_text(encoding="utf-8")
          alias_icons = {
              ".MainActivity": "evee_icon_default",
              ".MainActivityDesktop": "evee_icon_desktop",
              ".MainActivityWhite": "evee_icon_white",
              ".MainActivityBlack": "evee_icon_black",
          }
          for alias_name, drawable_name in alias_icons.items():
              pattern = r'(<activity-alias\b(?:(?!</activity-alias>).)*?android:name="' + re.escape(alias_name) + r'"(?:(?!</activity-alias>).)*?</activity-alias>)'
              match = re.search(pattern, manifest, flags=re.DOTALL)
              if not match:
                  raise SystemExit(f"Could not locate launcher alias {alias_name}.")
              block = match.group(1)
              block = re.sub(r'android:icon="@mipmap/[^"]+"', f'android:icon="@drawable/{drawable_name}"', block, count=1)
              block = re.sub(r'android:roundIcon="@mipmap/[^"]+"', f'android:roundIcon="@drawable/{drawable_name}"', block, count=1)
              manifest = manifest[:match.start(1)] + block + manifest[match.end(1):]
          manifest_file.write_text(manifest, encoding="utf-8")

          # Remove the desktop and More from us promotions from the main settings screen.
          settings_screen = Path("app/src/main/java/com/lastwave/app/ui/settings/SettingsScreen.kt")
          screen = settings_screen.read_text(encoding="utf-8")
          desktop_card_pattern = (
              r'                    SettingsActionCard\(\n'
              r'                        icon = Icons\.Filled\.Download,.*?'
              r'                    \)\n\n'
              r'                    Spacer\(Modifier\.height\(14\.dp\)\)\n'
              r'                    SectionLabel\("More from us"\)\n'
              r'                    Spacer\(Modifier\.height\(8\.dp\)\)\n'
              r'                    MoreFromUsCard\(.*?\n                    \)\n'
          )
          screen, promo_count = re.subn(desktop_card_pattern, '', screen, count=1, flags=re.DOTALL)
          if promo_count != 1:
              raise SystemExit("Could not remove the desktop and More from us promotional section.")
          if "LastWave-Desktop" in screen or 'SectionLabel("More from us")' in screen or "MoreFromUsCard(" in screen:
              raise SystemExit("LastWave desktop or More from us promotion remains.")
          settings_screen.write_text(screen, encoding="utf-8")

          # Remove the desktop download pill from the separate About card source.
          about_file = Path("app/src/main/java/com/lastwave/app/ui/settings/SettingsAboutSection.kt")
          about_source = about_file.read_text(encoding="utf-8")
          about_start = about_source.find("internal fun AboutCard(")
          if about_start < 0:
              raise SystemExit("Could not locate AboutCard in SettingsAboutSection.kt.")
          about = about_source[about_start:]
          about, about_desktop_count = re.subn(
              r'(            Text\(\n'
              r'                stringResource\(R\.string\.about_made_by\),.*?\n'
              r'            \)\n)'
              r'.*?(?=        }\n    }\n})',
              r'\1',
              about,
              count=1,
              flags=re.DOTALL,
          )
          if about_desktop_count != 1:
              raise SystemExit("Could not remove the About-card desktop download pill.")
          about_source = about_source[:about_start] + about
          if "LastWave-Desktop" in about_source:
              raise SystemExit("LastWave desktop link remains in AboutCard.")
          about_file.write_text(about_source, encoding="utf-8")

          # Add an opt-in Android 15+ floating music capsule. This is deliberately
          # isolated from the playback engine and is removed automatically when playback stops.
          manifest_file = Path("app/src/main/AndroidManifest.xml")
          manifest = manifest_file.read_text(encoding="utf-8")
          permission = '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />'
          if permission not in manifest:
              anchor = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
              if anchor not in manifest:
                  raise SystemExit("Could not locate manifest permission insertion point.")
              manifest = manifest.replace(anchor, anchor + "\n" + permission, 1)
              manifest_file.write_text(manifest, encoding="utf-8")

          overlay_file = Path("app/src/main/java/com/lastwave/app/playback/DynamicBarOverlay.kt")
          overlay_file.parent.mkdir(parents=True, exist_ok=True)
          overlay_source = r"""package com.lastwave.app.playback

          import android.content.Context
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          /**
           * Small, opt-in floating now-playing capsule for devices without a native
           * OEM media island. The system overlay permission is never requested silently.
           */
          internal class DynamicBarOverlay(
              context: Context,
              private val onOpen: () -> Unit,
              private val onPlayPause: () -> Unit,
              private val onNext: () -> Unit,
          ) {
              private val appContext = context.applicationContext
              private val windowManager = appContext.getSystemService(WindowManager::class.java)
              private var root: FrameLayout? = null
              private var titleView: TextView? = null
              private var artistView: TextView? = null
              private var playView: TextView? = null

              fun update(title: String, artist: String, isPlaying: Boolean) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.VANILLA_ICE_CREAM ||
                      !Settings.canDrawOverlays(appContext) || title.isBlank()
                  ) {
                      hide()
                      return
                  }

                  val view = root ?: createView().also { root = it }
                  titleView?.text = title
                  artistView?.text = artist
                  playView?.text = if (isPlaying) "Ⅱ" else "▶"
                  if (view.parent == null) {
                      runCatching { windowManager.addView(view, windowParams()) }
                          .onFailure { root = null }
                  }
              }

              fun hide() {
                  val view = root ?: return
                  runCatching { windowManager.removeViewImmediate(view) }
                  root = null
                  titleView = null
                  artistView = null
                  playView = null
              }

              private fun createView(): FrameLayout {
                  val frame = FrameLayout(appContext)
                  val pill = LinearLayout(appContext).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(14), dp(8), dp(10), dp(8))
                      background = GradientDrawable().apply {
                          setColor(Color.rgb(25, 26, 30))
                          cornerRadius = dp(32).toFloat()
                          setStroke(dp(1), Color.argb(70, 255, 255, 255))
                      }
                      elevation = dp(8).toFloat()
                  }
                  val musicMark = TextView(appContext).apply {
                      text = "♫"
                      textSize = 21f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          setColor(Color.rgb(75, 83, 105))
                          shape = GradientDrawable.OVAL
                      }
                  }
                  pill.addView(musicMark, LinearLayout.LayoutParams(dp(40), dp(40)))
                  val labels = LinearLayout(appContext).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(10), 0, dp(8), 0)
                      isClickable = true
                      setOnClickListener { onOpen() }
                  }
                  val titleLabel = TextView(appContext).apply {
                      textSize = 13f
                      setTextColor(Color.WHITE)
                      maxLines = 1
                      ellipsize = android.text.TextUtils.TruncateAt.END
                  }
                  val artistLabel = TextView(appContext).apply {
                      textSize = 11f
                      setTextColor(Color.LTGRAY)
                      maxLines = 1
                      ellipsize = android.text.TextUtils.TruncateAt.END
                  }
                  titleView = titleLabel
                  artistView = artistLabel
                  labels.addView(titleLabel)
                  labels.addView(artistLabel)
                  pill.addView(labels, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  val playButton = actionButton("Ⅱ", "Pause or resume") { onPlayPause() }
                  playView = playButton
                  pill.addView(playButton, LinearLayout.LayoutParams(dp(42), dp(42)))
                  pill.addView(actionButton("›", "Next track") { onNext() }, LinearLayout.LayoutParams(dp(38), dp(42)))
                  frame.addView(
                      pill,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT,
                      ).apply {
                          leftMargin = dp(16)
                          rightMargin = dp(16)
                      },
                  )
                  frame.setOnClickListener { onOpen() }
                  return frame
              }

              private fun actionButton(label: String, description: String, action: () -> Unit) =
                  TextView(appContext).apply {
                      text = label
                      textSize = 22f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      contentDescription = description
                      isFocusable = true
                      isClickable = true
                      setOnClickListener { action() }
                      background = GradientDrawable().apply {
                          setColor(Color.argb(35, 255, 255, 255))
                          shape = GradientDrawable.OVAL
                      }
                  }

              private fun windowParams() = WindowManager.LayoutParams(
                  WindowManager.LayoutParams.MATCH_PARENT,
                  dp(68),
                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                  PixelFormat.TRANSLUCENT,
              ).apply {
                  gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                  y = dp(22)
              }

              private fun dp(value: Int): Int =
                  (value * appContext.resources.displayMetrics.density).toInt()
          }
          """
          overlay_file.write_text(overlay_source, encoding="utf-8")

          service_file = Path("app/src/main/java/com/lastwave/app/playback/MusicPlaybackService.kt")
          service = service_file.read_text(encoding="utf-8")
          field_anchor = '    internal var widgetSignature = ""'
          if field_anchor not in service:
              raise SystemExit("Could not locate playback service field insertion point.")
          if "private var dynamicBarOverlay" not in service:
              service = service.replace(
                  field_anchor,
                  field_anchor + '\n    private var dynamicBarOverlay: DynamicBarOverlay? = null',
                  1,
              )
          create_anchor = '    override fun onCreate() {\n        super.onCreate()'
          create_replacement = '''    override fun onCreate() {
                  super.onCreate()
                  dynamicBarOverlay = DynamicBarOverlay(
                      context = this,
                      onOpen = {
                          packageManager.getLaunchIntentForPackage(packageName)?.let { launch ->
                              launch.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK or android.content.Intent.FLAG_ACTIVITY_SINGLE_TOP)
                              runCatching { startActivity(launch) }
                          }
                      },
                      onPlayPause = {
                          if (musicPlayer.state.value.isPlaying) musicPlayer.pause() else musicPlayer.resume()
                      },
                      onNext = { musicPlayer.next() },
                  )'''
          if create_anchor in service and "dynamicBarOverlay = DynamicBarOverlay(" not in service:
              service = service.replace(create_anchor, create_replacement, 1)
          elif "dynamicBarOverlay = DynamicBarOverlay(" not in service:
              raise SystemExit("Could not locate playback service onCreate insertion point.")
          publish_anchor = '                    publishNotification(state)\n                    publishWidget(state)'
          publish_replacement = '''                    publishNotification(state)
                              dynamicBarOverlay?.update(
                                  title = state.current?.title.orEmpty(),
                                  artist = state.current?.artist.orEmpty(),
                                  isPlaying = state.isPlaying,
                              )
                              publishWidget(state)'''
          if publish_anchor in service:
              service = service.replace(publish_anchor, publish_replacement, 1)
          elif "dynamicBarOverlay?.update(" not in service:
              raise SystemExit("Could not locate playback state publication point.")
          destroy_anchor = '    override fun onDestroy() {'
          if destroy_anchor not in service:
              raise SystemExit("Could not locate playback service onDestroy.")
          if 'dynamicBarOverlay?.hide()' not in service:
              service = service.replace(
                  destroy_anchor,
                  destroy_anchor + '\n        runCatching { dynamicBarOverlay?.hide() }\n        dynamicBarOverlay = null',
                  1,
              )
          service_file.write_text(service, encoding="utf-8")

          # Add a permission entry in Appearance. Android owns the special-access
          # toggle; returning from Settings causes the row to reflect the new state.
          screen_file = Path("app/src/main/java/com/lastwave/app/ui/settings/SettingsScreen.kt")
          screen = screen_file.read_text(encoding="utf-8")
          appearance_anchor = '                    SectionLabel(stringResource(R.string.settings_section_appearance))\n                    SettingsGroup(rowCount = 11) { index, position ->'
          appearance_replacement = '''                    SectionLabel(stringResource(R.string.settings_section_appearance))
                              val overlayContext = LocalContext.current
                              SettingsGroup(rowCount = 12) { index, position ->'''
          if appearance_anchor in screen:
              screen = screen.replace(appearance_anchor, appearance_replacement, 1)
          elif 'SettingsGroup(rowCount = 12)' not in screen:
              raise SystemExit("Could not locate Appearance settings group.")
          # Insert the new row immediately after the existing haptics row.
          haptics_end = '''                                isHighlighted = (highlightedSettingId == "appearance.ui_haptics"),
                            )
                        }'''
          new_row = '''                                isHighlighted = (highlightedSettingId == "appearance.ui_haptics"),
                            )
                            11 -> SettingsActionCard(
                                icon = Icons.Filled.Album,
                                iconContainer = MaterialTheme.colorScheme.tertiaryContainer,
                                iconTint = MaterialTheme.colorScheme.onTertiaryContainer,
                                title = "Dynamic Bar",
                                subtitle = when {
                                    android.os.Build.VERSION.SDK_INT < 35 -> "Floating capsule requires Android 15 or newer"
                                    android.provider.Settings.canDrawOverlays(overlayContext) -> "Permission enabled • appears while music plays"
                                    else -> "Tap to allow the floating music capsule"
                                },
                                onClick = {
                                    if (android.os.Build.VERSION.SDK_INT >= 35) {
                                        runCatching {
                                            overlayContext.startActivity(
                                                android.content.Intent(
                                                    android.provider.Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                                    android.net.Uri.fromParts("package", overlayContext.packageName, null),
                                                ),
                                            )
                                        }
                                    }
                                },
                                position = position,
                                isHighlighted = (highlightedSettingId == "appearance.dynamic_bar"),
                            )
                        }'''
          if 'title = "Dynamic Bar"' not in screen:
              haptics_marker = 'isHighlighted = (highlightedSettingId == "appearance.ui_haptics"),'
              if screen.count(haptics_marker) != 1:
                  raise SystemExit("Could not uniquely locate the UI haptics row.")
              marker_index = screen.index(haptics_marker)
              card_close = screen.index('\n                            )', marker_index)
              group_close = screen.index('\n                        }', card_close)
              dynamic_row = new_row.split('\n', 2)[2].rsplit('\n', 1)[0]
              screen = screen[:group_close] + '\n' + dynamic_row + screen[group_close:]
          screen_file.write_text(screen, encoding="utf-8")

          # EVEE Tune must not poll LastWave releases or surface LastWave update prompts.
          # Keep the manager API as a no-op because SettingsViewModel still injects it.
          update_manager_file = Path("app/src/main/java/com/lastwave/app/data/update/AppUpdateManager.kt")
          if update_manager_file.exists():
              manager = update_manager_file.read_text(encoding="utf-8")
              manager = manager.replace(
                  '    init {\n        checkForUpdate(isSilent = true)\n    }\n',
                  '',
                  1,
              )
              manager, check_count = re.subn(
                  r'    fun checkForUpdate\(isSilent: Boolean = false\) \{.*?\n    \}',
                  '    fun checkForUpdate(isSilent: Boolean = false) {\\n        _updateInfo.update { it.copy(isChecking = false, isUpdateAvailable = false, message = null) }\\n    }',
                  manager,
                  count=1,
                  flags=re.DOTALL,
              )
              manager, open_count = re.subn(
                  r'    fun openUpdate\(context: Context\) \{.*?\n    \}',
                  '    fun openUpdate(context: Context) { /* LastWave updater disabled in EVEE Tune. */ }',
                  manager,
                  count=1,
                  flags=re.DOTALL,
              )
              if check_count != 1 or open_count != 1:
                  raise SystemExit("Could not safely disable the upstream update manager.")
              update_manager_file.write_text(manager, encoding="utf-8")

          # Remove all update UI and its settings-search shortcut.
          settings_screen = Path("app/src/main/java/com/lastwave/app/ui/settings/SettingsScreen.kt")
          screen = settings_screen.read_text(encoding="utf-8")
          screen = screen.replace(
              '    val updateInfo by viewModel.updateInfo.collectAsStateWithLifecycle()\n',
              '',
              1,
          )
          screen = screen.replace(
              'subtitle = if (updateInfo.isUpdateAvailable) "Update Available (\${updateInfo.latestVersion}) • v\${appVersionName(context)}" else "v\${appVersionName(context)} • Language, Community, Source code"',
              'subtitle = "v\${appVersionName(context)} • Language, Community, Source code"',
              1,
          )
          screen, banner_count = re.subn(
              r'\n\s*// Prominent Update Available Banner Card.*?(?=\n\s*AboutCard\()',
              '',
              screen,
              count=1,
              flags=re.DOTALL,
          )
          screen, update_card_count = re.subn(
              r'\n\s*SettingsActionCard\(\n\s*icon = Icons\.Filled\.CloudDownload,.*?isHighlighted = \(highlightedSettingId == "about\.check_updates"\),\n\s*\)\n',
              '\n',
              screen,
              count=1,
              flags=re.DOTALL,
          )
          if banner_count != 1 or update_card_count != 1:
              raise SystemExit("Could not remove both LastWave update UI elements.")
          screen = screen.replace(
              'github.com/Clash-Projects/LastWave-native',
              'github.com/jinoshaju2006/EVEE-Tune',
          )
          screen = screen.replace(
              'https://github.com/Clash-Projects/LastWave-native',
              'https://github.com/jinoshaju2006/EVEE-Tune',
          )
          if "updateInfo" in screen or "about.check_updates" in screen or "LastWave-native/releases" in screen:
              raise SystemExit("LastWave update UI references remain in SettingsScreen.")
          settings_screen.write_text(screen, encoding="utf-8")

          search_index = Path("app/src/main/java/com/lastwave/app/ui/settings/SettingsSearchIndex.kt")
          if search_index.exists():
              index_text = search_index.read_text(encoding="utf-8")
              index_text, index_count = re.subn(
                  r'\n            add\(\n                SettingsEntry\(\n                    id = "about\.check_updates",.*?\n            \)\n',
                  '\n',
                  index_text,
                  count=1,
                  flags=re.DOTALL,
              )
              if index_count != 1:
                  raise SystemExit("Could not remove the LastWave update entry from settings search.")
              search_index.write_text(index_text, encoding="utf-8")

          PY

          cat > README.md <<'EOF'
          # EVEE Tune

          EVEE Tune is an independent Android app rebrand based on [LastWave Native](https://github.com/Clash-Projects/LastWave-Native).

          ## Current build identity
          - App label: **EVEE Tune**
          - Android application ID: `com.evee.tune`
          - Upstream code namespace: `com.lastwave.app` (kept internally to avoid breaking upstream component references)
          - Upstream baseline: LastWave v5.2.0 tag commit `6c7e9d8c3c14a6798de7251e21d723a62044508f`
          - Build: GitHub Actions debug APK

          ## Build
          Open **Actions → Import EVEE Tune Android source → Run workflow**. The workflow imports the upstream Android source, applies the EVEE Tune app label and application ID, commits the source, and attempts a debug APK build. The APK is uploaded as an Actions artifact when the build succeeds.

          For a local build, use Android Studio with JDK 17 and Android SDK 37, then run:

          ```bash
          ./gradlew :app:assembleDebug
          ```

          ## Attribution and license
          This project is based on LastWave Native by its upstream contributors. Upstream copyright notices and the GPL-3.0 license are preserved in this repository. See [LICENSE](LICENSE) and the [upstream repository](https://github.com/Clash-Projects/LastWave-Native).

          EVEE Tune is independent and is not affiliated with or endorsed by the upstream developers or any music service. All third-party names and trademarks belong to their respective owners.
          EOF

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import LastWave Native source and rebrand as EVEE Tune"
          git push origin HEAD

      - name: Build EVEE Tune debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EVEE-Tune-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
