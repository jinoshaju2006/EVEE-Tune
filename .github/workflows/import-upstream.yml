name: Import EVEE Tune Android source
# Stable baseline: preserve the known-good 8211636 app behavior; no refresh-rate override.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-upstream.yml"

permissions:
  contents: write

concurrency:
  group: evee-tune-source-import
  cancel-in-progress: false

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EVEE Tune
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-37.0" "cmake;3.22.1" "ndk;27.2.12479018"
          # Android SDK publishes API 37 under android-37.0; AGP 9.1 expects android-37.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Download upstream source
        run: |
          git init /tmp/lastwave-upstream
          git -C /tmp/lastwave-upstream remote add origin https://github.com/Clash-Projects/LastWave-Native.git
          git -C /tmp/lastwave-upstream fetch --depth 1 origin b3234549a51b1d77ab9c50fabfe88ea0b869380f
          git -C /tmp/lastwave-upstream checkout --detach FETCH_HEAD

      - name: Import source and apply EVEE Tune identity
        shell: bash
        run: |
          set -euo pipefail
          # Remove the previous imported source before overlaying the new upstream tree.
          # This prevents deleted/renamed upstream Kotlin files from surviving as stale duplicates.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'README.md' ! -name 'evee_icon.png' ! -name 'app_icon_*.png' -exec rm -rf {} +
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='README.md' /tmp/lastwave-upstream/ ./
          # Preserve the user-uploaded EVEE Tune artwork and install it as the adaptive launcher icon.
          if [ ! -s evee_icon.png ]; then
            echo 'evee_icon.png is missing from the repository root.' >&2
            exit 1
          fi
          mkdir -p app/src/main/res/drawable-nodpi
          cp evee_icon.png app/src/main/res/drawable-nodpi/evee_icon.png
          # Preserve and install the four user-supplied EVEE Tune appearance icons.
          for icon in app_icon_default_.png app_icon_black_and_white.png app_icon_monochrome.png app_icon_pink_.png; do
            if [ ! -s "$icon" ]; then
              echo "Required appearance icon $icon is missing from the repository root." >&2
              exit 1
            fi
          done
          cp app_icon_default_.png app/src/main/res/drawable-nodpi/evee_icon_default.png
          cp app_icon_black_and_white.png app/src/main/res/drawable-nodpi/evee_icon_desktop.png
          cp app_icon_monochrome.png app/src/main/res/drawable-nodpi/evee_icon_white.png
          cp app_icon_pink_.png app/src/main/res/drawable-nodpi/evee_icon_black.png

          python3 <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("app/build.gradle.kts")
          gradle = gradle_file.read_text(encoding="utf-8")
          old = 'applicationId = if (vivoOrigin) "com.tencent.qqmusic" else "com.lastwave.app"'
          new = 'applicationId = if (vivoOrigin) "com.tencent.qqmusic" else "com.evee.tune"'
          if old not in gradle:
              raise SystemExit("Could not find the expected upstream applicationId line; stopping without committing.")
          gradle_file.write_text(gradle.replace(old, new, 1), encoding="utf-8")

          settings_file = Path("settings.gradle.kts")
          if settings_file.exists():
              settings = settings_file.read_text(encoding="utf-8")
              settings_file.write_text(settings.replace('rootProject.name = "LastWave"', 'rootProject.name = "EVEE Tune"'), encoding="utf-8")

          strings_file = Path("app/src/main/res/values/strings.xml")
          strings = strings_file.read_text(encoding="utf-8")
          strings, count = re.subn(
              r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
              r'\1EVEE Tune\2',
              strings,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("Could not update the launcher app label; stopping without committing.")
          strings_file.write_text(strings, encoding="utf-8")

          # Point Android 8+ adaptive launcher icons at the supplied EVEE Tune artwork.
          for icon_xml in (Path("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"), Path("app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml")):
              if icon_xml.exists():
                  icon_text = icon_xml.read_text(encoding="utf-8")
                  icon_text = re.sub(r'android:drawable="@drawable/ic_launcher_foreground"', 'android:drawable="@drawable/evee_icon"', icon_text)
                  icon_text = re.sub(r'\\s*<monochrome\\s+android:drawable="@drawable/evee_icon"\\s*/>', '', icon_text)
                  icon_xml.write_text(icon_text, encoding="utf-8")

          # Rebrand user-visible strings across default and translated resources.
          for resource_file in Path("app/src/main/res").glob("values*/strings.xml"):
              resource_text = resource_file.read_text(encoding="utf-8")
              resource_text = resource_text.replace("Made by LastWave Team", "Made by EVO")
              resource_text = resource_text.replace("LastWave Team", "EVO")
              resource_text = resource_text.replace("LastWave", "EVEE Tune")
              resource_file.write_text(resource_text, encoding="utf-8")

          # Keep the About screen's developer credit explicit in the default locale.
          strings = strings_file.read_text(encoding="utf-8")
          strings, about_count = re.subn(
              r'(<string\s+name="about_made_by"[^>]*>).*?(</string>)',
              r'\1Made by EVO\2',
              strings,
              count=1,
              flags=re.DOTALL,
          )
          if about_count != 1:
              raise SystemExit("Could not set the EVEE Tune developer credit; stopping without committing.")
          strings_file.write_text(strings, encoding="utf-8")

          # Replace the upstream About & Community links with EVEE Tune's contact details.
          settings_screen = Path("app/src/main/java/com/lastwave/app/ui/settings/SettingsScreen.kt")
          if settings_screen.exists():
              screen = settings_screen.read_text(encoding="utf-8")
              about_section = screen.find('SectionLabel(stringResource(R.string.settings_section_about))')
              group_start = screen.find('SettingsGroup(rowCount = 4)', about_section)
              group_end = screen.find('                    Spacer(Modifier.height(4.dp))', group_start)
              if about_section < 0 or group_start < 0 or group_end < 0:
                  raise SystemExit("Could not locate the About & Community cards; stopping without committing.")
              replacement = '''SettingsGroup(rowCount = 2) { index, position ->
                          when (index) {
                              0 -> SettingsActionCard(
                                  icon = Icons.Filled.Code,
                                  iconContainer = MaterialTheme.colorScheme.primaryContainer,
                                  iconTint = MaterialTheme.colorScheme.onPrimaryContainer,
                                  title = "Developed By EVO",
                                  subtitle = "Instagram: https://www.instagram.com/e.v_.o?mdxt=MTZvZGg2a2R6cmx5dA==",
                                  onClick = {
                                      val intent = Intent(Intent.ACTION_VIEW, Uri.parse("https://www.instagram.com/e.v_.o?mdxt=MTZvZGg2a2R6cmx5dA=="))
                                      if (!startActivitySafely(context, intent)) {
                                          viewModel.showToast(context.getString(R.string.toast_no_browser))
                                      }
                                  },
                                  position = position,
                                  isHighlighted = (highlightedSettingId == "about.developer"),
                              )
                              1 -> SettingsActionCard(
                                  icon = Icons.AutoMirrored.Filled.Send,
                                  iconContainer = MaterialTheme.colorScheme.secondaryContainer,
                                  iconTint = MaterialTheme.colorScheme.onSecondaryContainer,
                                  title = "Connect directly for reporting bugs and any other issues",
                                  subtitle = "jinomattathil@gmail.com",
                                  onClick = {
                                      val intent = Intent(Intent.ACTION_SENDTO, Uri.parse("mailto:jinomattathil@gmail.com"))
                                      if (!startActivitySafely(context, intent)) {
                                          viewModel.showToast(context.getString(R.string.toast_no_browser))
                                      }
                                  },
                                  position = position,
                                  isHighlighted = (highlightedSettingId == "about.contact"),
                              )
                          }
                      }
              '''
              screen = screen[:group_start] + replacement + screen[group_end:]
              screen = screen.replace('contentDescription = "LastWave"', 'contentDescription = "EVEE Tune"')
              screen = screen.replace('Text("LastWave", style = MaterialTheme.typography.headlineSmall', 'Text("EVEE Tune", style = MaterialTheme.typography.headlineSmall')
              settings_screen.write_text(screen, encoding="utf-8")
          # Patch the first-launch Join Support dialog (separate from the About menu).
          main_shell = Path("app/src/main/java/com/lastwave/app/ui/shell/MainShell.kt")
          if not main_shell.exists():
              raise SystemExit("Could not find MainShell.kt for the Join Support dialog patch.")
          shell = main_shell.read_text(encoding="utf-8")
          dialog_pattern = r'@Composable\nprivate fun JoinSupportDialog\(\n    onDismiss: \(\) -> Unit,\n\) \{.*?\n\}\n\nprivate fun openMaterialYouChannel'
          dialog_replacement = '''@Composable
          private fun JoinSupportDialog(
              onDismiss: () -> Unit,
          ) {
              val context = LocalContext.current
              AlertDialog(
                  onDismissRequest = onDismiss,
                  shape = RoundedCornerShape(24.dp),
                  containerColor = MaterialTheme.colorScheme.surfaceContainerHigh,
                  title = {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween,
                      ) {
                          Column {
                              Text(
                                  text = "Developed By EVO/Jino",
                                  style = MaterialTheme.typography.titleMedium,
                                  fontWeight = FontWeight.Bold,
                              )
                              Text(
                                  text = "EVEE Tune developer and support",
                                  style = MaterialTheme.typography.labelSmall,
                                  color = MaterialTheme.colorScheme.primary,
                                  fontWeight = FontWeight.SemiBold,
                              )
                          }
                          IconButton(onClick = onDismiss, modifier = Modifier.size(28.dp)) {
                              Icon(
                                  imageVector = Icons.Filled.Close,
                                  contentDescription = "Close",
                                  tint = MaterialTheme.colorScheme.onSurfaceVariant,
                                  modifier = Modifier.size(18.dp),
                              )
                          }
                      }
                  },
                  text = {
                      Column(
                          modifier = Modifier.fillMaxWidth(),
                          verticalArrangement = Arrangement.spacedBy(10.dp),
                      ) {
                          Text(
                              text = "Connect directly for reporting bugs and any other issues.",
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                          Surface(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(14.dp))
                                  .clickable {
                                      runCatching {
                                          context.startActivity(
                                              android.content.Intent(
                                                  android.content.Intent.ACTION_VIEW,
                                                  android.net.Uri.parse("https://www.instagram.com/e.v_.o?mdxt=MTZvZGg2a2R6cmx5dA=="),
                                              ),
                                          )
                                      }.onFailure {
                                          android.widget.Toast.makeText(context, "No browser available to open Instagram", android.widget.Toast.LENGTH_SHORT).show()
                                      }
                                      onDismiss()
                                  },
                              color = MaterialTheme.colorScheme.surfaceContainerHighest.copy(alpha = 0.70f),
                              shape = RoundedCornerShape(14.dp),
                          ) {
                              Column(Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 12.dp)) {
                                  Text("Instagram", style = MaterialTheme.typography.labelLarge, fontWeight = FontWeight.SemiBold)
                                  Text(
                                      "https://www.instagram.com/e.v_.o?mdxt=MTZvZGg2a2R6cmx5dA==",
                                      style = MaterialTheme.typography.bodySmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                          }
                          Surface(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(14.dp))
                                  .clickable {
                                      runCatching {
                                          context.startActivity(
                                              android.content.Intent(
                                                  android.content.Intent.ACTION_SENDTO,
                                                  android.net.Uri.parse("mailto:jinomattathil@gmail.com"),
                                              ),
                                          )
                                      }.onFailure {
                                          android.widget.Toast.makeText(context, "No email app available", android.widget.Toast.LENGTH_SHORT).show()
                                      }
                                      onDismiss()
                                  },
                              color = MaterialTheme.colorScheme.surfaceContainerHighest.copy(alpha = 0.70f),
                              shape = RoundedCornerShape(14.dp),
                          ) {
                              Column(Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 12.dp)) {
                                  Text(
                                      "Connect directly for reporting bugs and any other issues",
                                      style = MaterialTheme.typography.labelLarge,
                                      fontWeight = FontWeight.SemiBold,
                                  )
                                  Text(
                                      "jinomattathil@gmail.com",
                                      style = MaterialTheme.typography.bodySmall,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                                  )
                              }
                          }
                      }
                  },
                  confirmButton = {
                      FilledTonalButton(onClick = onDismiss, shape = RoundedCornerShape(14.dp)) {
                          Text("Close", style = MaterialTheme.typography.labelMedium, fontWeight = FontWeight.SemiBold)
                      }
                  },
              )
          }
          
          private fun openMaterialYouChannel'''
          shell, dialog_count = re.subn(dialog_pattern, lambda _: dialog_replacement, shell, count=1, flags=re.DOTALL)
          if dialog_count != 1:
              raise SystemExit("Could not replace the first-launch Join Support dialog; stopping without committing.")
          main_shell.write_text(shell, encoding="utf-8")

          # Use the supplied EVEE Tune artwork in the About & Community card itself.
          settings_screen = Path("app/src/main/java/com/lastwave/app/ui/settings/SettingsScreen.kt")
          screen = settings_screen.read_text(encoding="utf-8")
          about_icon_old = 'painter = painterResource(appIcon.logoRes),\n                    contentDescription = "EVEE Tune"'
          about_icon_new = 'painter = painterResource(R.drawable.evee_icon),\n                    contentDescription = "EVEE Tune"'
          if about_icon_old not in screen:
              raise SystemExit("Could not locate the About card logo; stopping without committing.")
          screen = screen.replace(about_icon_old, about_icon_new, 1)
          settings_screen.write_text(screen, encoding="utf-8")

          # Connect the four appearance choices to the supplied EVEE Tune artwork.
          app_icon_file = Path("app/src/main/java/com/lastwave/app/data/local/AppIcon.kt")
          if not app_icon_file.exists():
              raise SystemExit("Could not locate AppIcon.kt; stopping without committing.")
          app_icon_source = app_icon_file.read_text(encoding="utf-8")
          icon_replacements = {
              "R.drawable.ic_launcher_logo,": "R.drawable.evee_icon_default,",
              "R.drawable.ic_launcher_logo_desktop,": "R.drawable.evee_icon_desktop,",
              "R.drawable.ic_launcher_logo_white,": "R.drawable.evee_icon_white,",
              "R.drawable.ic_launcher_logo_black,": "R.drawable.evee_icon_black,",
          }
          for old_icon, new_icon in icon_replacements.items():
              if app_icon_source.count(old_icon) != 1:
                  raise SystemExit(f"Could not uniquely locate {old_icon} in AppIcon.kt.")
              app_icon_source = app_icon_source.replace(old_icon, new_icon, 1)
          app_icon_file.write_text(app_icon_source, encoding="utf-8")

          # Ensure each launcher alias uses the matching supplied icon as well.
          manifest_file = Path("app/src/main/AndroidManifest.xml")
          manifest = manifest_file.read_text(encoding="utf-8")
          alias_icons = {
              ".MainActivity": "evee_icon_default",
              ".MainActivityDesktop": "evee_icon_desktop",
              ".MainActivityWhite": "evee_icon_white",
              ".MainActivityBlack": "evee_icon_black",
          }
          for alias_name, drawable_name in alias_icons.items():
              pattern = r'(<activity-alias\b(?:(?!</activity-alias>).)*?android:name="' + re.escape(alias_name) + r'"(?:(?!</activity-alias>).)*?</activity-alias>)'
              match = re.search(pattern, manifest, flags=re.DOTALL)
              if not match:
                  raise SystemExit(f"Could not locate launcher alias {alias_name}.")
              block = match.group(1)
              block = re.sub(r'android:icon="@mipmap/[^"]+"', f'android:icon="@drawable/{drawable_name}"', block, count=1)
              block = re.sub(r'android:roundIcon="@mipmap/[^"]+"', f'android:roundIcon="@drawable/{drawable_name}"', block, count=1)
              manifest = manifest[:match.start(1)] + block + manifest[match.end(1):]
          manifest_file.write_text(manifest, encoding="utf-8")

          # Remove the LastWave desktop promotion from both About locations,
          # and remove the complete More from us section and its three app cards.
          screen = settings_screen.read_text(encoding="utf-8")

          desktop_card_pattern = (
              r'                    SettingsActionCard\(\n'
              r'                        icon = Icons\.Filled\.Download,.*?'
              r'                    \)\n\n'
              r'                    Spacer\(Modifier\.height\(14\.dp\)\)\n'
              r'                    SectionLabel\("More from us"\)\n'
              r'                    Spacer\(Modifier\.height\(8\.dp\)\)\n'
              r'                    MoreFromUsCard\(.*?\n                    \)\n'
          )
          screen, promo_count = re.subn(desktop_card_pattern, '', screen, count=1, flags=re.DOTALL)
          if promo_count != 1:
              raise SystemExit("Could not remove the desktop and More from us promotional section.")

          # Remove the now-unused three-app promotional composable.
          screen, more_count = re.subn(
              r'private fun MoreFromUsCard\(.*?(?=private fun AboutCard\()',
              '',
              screen,
              count=1,
              flags=re.DOTALL,
          )
          if more_count != 1:
              raise SystemExit("Could not remove the MoreFromUsCard composable.")

          # Remove everything after the About card's developer-credit text;
          # this tail is the upstream desktop-download pill and its nested layout.
          about_start = screen.find("private fun AboutCard(")
          about_end = screen.find("\nprivate fun openTelegramChannel", about_start)
          if about_start < 0 or about_end < 0:
              raise SystemExit("Could not locate the About card to remove its desktop link.")
          about = screen[about_start:about_end]
          about, about_desktop_count = re.subn(
              r'(            Text\(\n'
              r'                stringResource\(R\.string\.about_made_by\),.*?\n'
              r'            \)\n)'
              r'.*?(?=        }\n    }\n})',
              r'\1',
              about,
              count=1,
              flags=re.DOTALL,
          )
          if about_desktop_count != 1:
              raise SystemExit("Could not remove the complete desktop download area from the About card.")
          screen = screen[:about_start] + about + screen[about_end:]

          if "LastWave-Desktop" in screen or 'SectionLabel("More from us")' in screen or "MoreFromUsCard(" in screen:
              raise SystemExit("Promotional LastWave desktop or More from us content remains.")
          settings_screen.write_text(screen, encoding="utf-8")

          PY

          cat > README.md <<'EOF'
          # EVEE Tune

          EVEE Tune is an independent Android app rebrand based on [LastWave Native](https://github.com/Clash-Projects/LastWave-Native).

          ## Current build identity
          - App label: **EVEE Tune**
          - Android application ID: `com.evee.tune`
          - Upstream code namespace: `com.lastwave.app` (kept internally to avoid breaking upstream component references)
          - Upstream baseline: verified build commit `b3234549a51b1d77ab9c50fabfe88ea0b869380f` (LastWave v5.1.2)
          - Build: GitHub Actions debug APK

          ## Build
          Open **Actions → Import EVEE Tune Android source → Run workflow**. The workflow imports the upstream Android source, applies the EVEE Tune app label and application ID, commits the source, and attempts a debug APK build. The APK is uploaded as an Actions artifact when the build succeeds.

          For a local build, use Android Studio with JDK 17 and Android SDK 37, then run:

          ```bash
          ./gradlew :app:assembleDebug
          ```

          ## Attribution and license
          This project is based on LastWave Native by its upstream contributors. Upstream copyright notices and the GPL-3.0 license are preserved in this repository. See [LICENSE](LICENSE) and the [upstream repository](https://github.com/Clash-Projects/LastWave-Native).

          EVEE Tune is independent and is not affiliated with or endorsed by the upstream developers or any music service. All third-party names and trademarks belong to their respective owners.
          EOF

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import LastWave Native source and rebrand as EVEE Tune"
          git push origin HEAD

      - name: Build EVEE Tune debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EVEE-Tune-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
